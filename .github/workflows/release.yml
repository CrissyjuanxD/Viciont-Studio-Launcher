name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Comprobar versión
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Comprobar regresiones
        run: npm test

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          v="${tag#v}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            if [ -f "docs/releases/$v.md" ]; then
              gh release create "$tag" --title "Viciont Studios Launcher $v" --notes-file "docs/releases/$v.md" --latest
            else
              gh release create "$tag" --title "Viciont Studios Launcher $v" --notes "Descarga el launcher para tu sistema desde Assets: .exe para Windows, .dmg para macOS y .AppImage, .deb o .rpm para Linux." --latest
            fi
          fi

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enlace fijo a la última versión
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $v = $tag.TrimStart('v')
          Copy-Item "dist/Viciont-Studios-Launcher-Setup-$v.exe" "dist/Viciont-Studios-Launcher-Setup.exe"
          gh release upload $tag "dist/Viciont-Studios-Launcher-Setup.exe" --clobber

  mac:
    needs: release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --mac --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enlace fijo a la última versión
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          v="${tag#v}"
          cp "dist/Viciont-Studios-Launcher-$v-mac.dmg" "dist/Viciont-Studios-Launcher-mac.dmg"
          gh release upload "$tag" "dist/Viciont-Studios-Launcher-mac.dmg" --clobber

  linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npx electron-builder --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enlaces fijos a la última versión
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          for ext in AppImage deb rpm; do
            cp dist/*."$ext" "dist/Viciont-Studios-Launcher-linux.$ext"
            gh release upload "$tag" "dist/Viciont-Studios-Launcher-linux.$ext" --clobber
          done
