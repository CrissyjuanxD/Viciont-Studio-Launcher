name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Crear la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $v = $tag.TrimStart('v')
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Viciont Studios Launcher $v" --notes "Descarga **Viciont-Studios-Launcher-Setup-$v.exe** en *Assets* y ábrelo. Los launchers instalados se actualizan solos." --latest
          }
          exit 0
      - run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enlace fijo a la última versión
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $v = $tag.TrimStart('v')
          Copy-Item "dist/Viciont-Studios-Launcher-Setup-$v.exe" "dist/Viciont-Studios-Launcher-Setup.exe"
          gh release upload $tag "dist/Viciont-Studios-Launcher-Setup.exe" --clobber
